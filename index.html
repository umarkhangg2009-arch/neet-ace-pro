<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020"><link rel="manifest" href="manifest.webmanifest">
<title>NEET ACE PRO</title>
<style>
:root{--bg:#080d19;--p:#111a2b;--line:#263651;--txt:#edf4ff;--muted:#9badc7;--cyan:#54e0d0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px system-ui}header{padding:18px;position:sticky;top:0;background:#080d19ed;border-bottom:1px solid var(--line)}h1{font-size:20px;margin:0}header small,.muted{color:var(--muted)}main{max-width:850px;margin:auto;padding:16px 14px 90px}.hero,.card{padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--p);margin-bottom:13px}.hero{background:linear-gradient(130deg,#17365c,#12333a)}.hero h2{font-size:25px;margin:8px 0}.stats,.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:14px}.stat,.tile{padding:13px;border:1px solid #ffffff20;border-radius:13px;background:#081526}.stat b{display:block;font-size:20px}.stat small,.tile small{color:var(--muted)}.tile{color:var(--txt);text-align:left;min-height:90px}.tile b{display:block;margin:8px 0}.section{margin:22px 2px 10px}select,button{font:inherit}select{width:100%;padding:12px;margin:5px 0;background:#17243a;color:var(--txt);border:1px solid var(--line);border-radius:11px}.btn{padding:12px;border:0;border-radius:11px;background:linear-gradient(100deg,#4289f5,#36cbbd);font-weight:800;color:#04111d}.secondary{background:#22324c;color:var(--txt);border:1px solid var(--line)}.option{display:block;padding:12px;margin:8px 0;border:1px solid var(--line);border-radius:11px;background:#0b1525}.notice{padding:12px;background:#18263b;border-left:3px solid #ffcf70;border-radius:8px;color:#c5d4e8;font-size:13px;line-height:1.5}.hidden{display:none}.feedback{padding:12px;background:#0b2630;border-radius:10px;margin-top:10px;color:#c8f8ef}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#0b1322;border-top:1px solid var(--line);padding:10px}nav button{background:none;border:0;color:var(--muted);font-size:12px}nav button.active{color:var(--cyan)}@media(min-width:650px){.tiles{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><h1>⚡ NEET ACE PRO</h1><small>NEET 2027 • Smart preparation workspace</small></header><main id="app"></main>
<nav><button data-tab="home" class="active">⌂ Home</button><button data-tab="practice">✎ Practice</button><button data-tab="pyq">◷ PYQ</button><button data-tab="progress">▥ Progress</button></nav>
<script>
const syllabus={
Physics:{"Class 11":["Physical World and Measurement","Kinematics","Laws of Motion","Work, Energy and Power","Rotational Motion","Gravitation","Properties of Solids and Liquids","Thermodynamics","Kinetic Theory","Oscillations","Waves"],"Class 12":["Electrostatics","Current Electricity","Magnetic Effects of Current and Magnetism","Electromagnetic Induction and AC","Electromagnetic Waves","Optics","Dual Nature of Radiation and Matter","Atoms and Nuclei","Electronic Devices"]},
Chemistry:{"Class 11":["Some Basic Concepts of Chemistry","Structure of Atom","Classification of Elements and Periodicity","Chemical Bonding","Chemical Thermodynamics","Equilibrium","Redox Reactions","Organic Chemistry: Basic Principles","Hydrocarbons"],"Class 12":["Solutions","Electrochemistry","Chemical Kinetics","d- and f-Block Elements","Coordination Compounds","Haloalkanes and Haloarenes","Alcohols, Phenols and Ethers","Aldehydes, Ketones and Carboxylic Acids","Amines","Biomolecules"]},
Botany:{"Class 11":["The Living World","Biological Classification","Plant Kingdom","Morphology of Flowering Plants","Anatomy of Flowering Plants","Cell: The Unit of Life","Biomolecules","Cell Cycle and Cell Division"],"Class 12":["Sexual Reproduction in Flowering Plants","Principles of Inheritance and Variation","Molecular Basis of Inheritance","Evolution","Microbes in Human Welfare","Biotechnology: Principles and Processes","Biotechnology and its Applications","Organisms and Populations","Ecosystem","Biodiversity and Conservation"]},
Zoology:{"Class 11":["Animal Kingdom","Structural Organisation in Animals","Breathing and Exchange of Gases","Body Fluids and Circulation","Excretory Products and their Elimination","Locomotion and Movement","Neural Control and Coordination","Chemical Coordination and Integration"],"Class 12":["Human Reproduction","Reproductive Health","Human Health and Disease"]}};
const bank=[
["Physics","Class 12","Current Electricity","A wire of resistance R is stretched to twice its original length, with volume constant. Its new resistance is?",["R/2","R","2R","4R"],3,"At constant volume, area halves when length doubles. R = ρL/A, so resistance becomes 4R."],
["Chemistry","Class 12","Chemical Kinetics","For a first-order reaction, the time for 75% completion is:",["t½","2t½","3t½","4t½"],1,"After two half-lives, 25% remains; hence 75% is complete."],
["Botany","Class 12","Sexual Reproduction in Flowering Plants","A typical mature Polygonum-type embryo sac is:",["4-celled, 4-nucleate","7-celled, 8-nucleate","8-celled, 7-nucleate","7-celled, 7-nucleate"],1,"The typical Polygonum-type embryo sac has seven cells and eight nuclei."],
["Zoology","Class 12","Human Reproduction","Which sperm structure contains enzymes that help penetrate egg coverings?",["Middle piece","Acrosome","Neck","Tail"],1,"The acrosome is a Golgi-derived cap containing hydrolytic enzymes."],
["Physics","Class 11","Laws of Motion","A body moves at constant velocity in a straight line. The net force is:",["Equal to its weight","Zero","Increasing","Equal to momentum"],1,"Constant velocity means zero acceleration; by Newton's second law net force is zero."],
["Chemistry","Class 11","Structure of Atom","Maximum electrons in a shell with n = 3:",["8","18","32","9"],1,"Shell capacity is 2n²; for n=3, this is 18."]
];
let tab="home",subject="Physics",level="Class 12",chapter="Current Electricity",pick=null,done=false,idx=0;
let record=JSON.parse(localStorage.getItem("nap_record")||'{"attempted":0,"correct":0,"saved":[]}');
const app=document.getElementById("app"),$=id=>document.getElementById(id);
function persist(){localStorage.setItem("nap_record",JSON.stringify(record))}
function nav(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab))}
function home(){app.innerHTML=`<section class="hero"><small style="color:var(--cyan)">YOUR NEET JOURNEY STARTS HERE</small><h2>Prepare smarter. Score higher.</h2><p>Chapterwise practice, genuine PYQ workspace and progress tracking.</p><div class="stats"><div class="stat"><b>${record.attempted}</b><small>ATTEMPTED</small></div><div class="stat"><b>${record.correct}</b><small>CORRECT</small></div></div></section><h3 class="section">Choose a subject</h3><div class="tiles">${Object.keys(syllabus).map((s,i)=>`<button class="tile" onclick="subject='${s}';tab='practice';nav();practice()"><big>${['⚡','🧪','🌿','🫀'][i]}</big><b>${s}</b><small>Class 11 + 12</small></button>`).join('')}</div><div class="notice" style="margin-top:14px">Starter build: navigation and demo practice are working. The full 100-question-per-chapter bank and verified year-tagged PYQs still need to be added. Demo questions are not labelled as PYQs.</div>`}
function options(){return Object.entries(syllabus[subject]).map(([k,v])=>`<optgroup label="${k}">${v.map(c=>`<option ${c===chapter?'selected':''}>${c}</option>`).join('')}</optgroup>`).join('')}
function practice(){tab='practice';nav();app.innerHTML=`<h3>Chapter Practice</h3><select id="sub" onchange="subject=this.value;chapter=syllabus[subject]['Class 11'][0];practice()">${Object.keys(syllabus).map(s=>`<option ${s===subject?'selected':''}>${s}</option>`).join('')}</select><select id="lev" onchange="level=this.value;chapter=syllabus[subject][level][0];practice()"><option ${level==='Class 11'?'selected':''}>Class 11</option><option ${level==='Class 12'?'selected':''}>Class 12</option></select><select id="chap" onchange="chapter=this.value;idx=0;renderQ()">${options()}</select><div class="notice">Syllabus selector is ready. Only demonstration questions are loaded at present; full chapter banks will be populated in checked batches.</div><div id="qarea"></div>`;renderQ()}
function renderQ(){let qs=bank.filter(x=>x[0]===subject&&x[1]===level&&x[2]===chapter),q=qs[idx];if(!q){$('qarea').innerHTML=`<div class="card"><b>${chapter}</b><p class="muted">No question bank loaded yet.</p><p>Target: 100 original practice questions for this chapter, plus genuine PYQs where available.</p></div>`;return}
$('qarea').innerHTML=`<div class="card"><small>${subject} • ${level} • ${chapter}</small><p><b>${q[3]}</b></p>${q[4].map((o,i)=>`<label class="option"><input type="radio" name="ans" value="${i}" ${pick===i?'checked':''} ${done?'disabled':''}> ${'ABCD'[i]}. ${o}</label>`).join('')}<div class="${done?'feedback':'hidden'}">${q[6]}</div><p><button class="btn" onclick="check()" ${done?'disabled':''}>Check answer</button> <button class="btn secondary" onclick="bookmark()">☆ Bookmark</button></p></div>`;
document.querySelectorAll('input[name=ans]').forEach(el=>el.addEventListener('change',()=>pick=Number(el.value)))}
function check(){let q=bank.filter(x=>x[0]===subject&&x[1]===level&&x[2]===chapter)[idx];if(!q||pick===null)return;done=true;record.attempted++;if(pick===q[5])record.correct++;persist();renderQ()}
function bookmark(){let q=bank.find(x=>x[0]===subject&&x[1]===level&&x[2]===chapter);if(q&&!record.saved.includes(q[3]))record.saved.push(q[3]);persist();alert('Question bookmarked')}
function pyq(){tab='pyq';nav();app.innerHTML=`<h3>Genuine NEET PYQs</h3><div class="card"><p>PYQs will be included only when the question can be matched to a genuine NEET paper and year.</p><div class="notice">The verified PYQ archive is not loaded in this starter build yet. No fabricated questions are shown as past-year questions.</div></div>`}
function progress(){tab='progress';nav();app.innerHTML=`<h3>My Progress</h3><div class="card"><div class="stats"><div class="stat"><b>${record.attempted}</b><small>ATTEMPTED</small></div><div class="stat"><b>${record.correct}</b><small>CORRECT</small></div><div class="stat"><b>${record.saved.length}</b><small>BOOKMARKS</small></div></div><p><button class="btn secondary" onclick="if(confirm('Reset progress?')){record={attempted:0,correct:0,saved:[]};persist();progress()}">Reset progress</button></p></div>`}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>({home,practice,pyq,progress}[b.dataset.tab])());home();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></main></body></html>
